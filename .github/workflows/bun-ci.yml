name: Bun CI

permissions:
  contents: read

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, "feat/local-production-readiness"]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main, "feat/apple-silicon-*"]
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
      BETTER_AUTH_SECRET: "supersecret"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      UPSTASH_REDIS_REST_URL: "https://your-upstash-redis-url"
      UPSTASH_REDIS_REST_TOKEN: "your-upstash-redis-token"
      NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.example.com"
      MARBLE_WORKSPACE_KEY: "placeholder"
      FREESOUND_CLIENT_ID: "placeholder"
      FREESOUND_API_KEY: "placeholder"
      CLOUDFLARE_ACCOUNT_ID: "placeholder"
      R2_ACCESS_KEY_ID: "placeholder"
      R2_SECRET_ACCESS_KEY: "placeholder"
      R2_BUCKET_NAME: "placeholder"
      MODAL_TRANSCRIPTION_URL: "https://placeholder.example.com"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.2.18-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        working-directory: apps/web
        run: bun run build

      - name: Run tests
        run: bun test
      - name: Check browser harness types
        if: runner.os == 'Linux'
        run: bun run test:browser:types
      - name: Install browser and media inspection tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          bunx playwright install --with-deps chromium
      - name: Verify production browser storage and export
        if: runner.os == 'Linux'
        env:
          OPENCUT_BROWSER_START_SERVER: "1"
        run: bun run test:browser
      - name: Preserve browser failure diagnostics
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-integration-${{ github.event_name }}
          path: |
            .mac-runtime/browser-integration-report.json
            .mac-runtime/browser-test-results
          if-no-files-found: ignore
          retention-days: 7

  native-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native test dependencies
        run: python -m pip install -r scripts/mac/locks/tests.lock
      - name: Test native ownership, access and measurement logic
        env:
          PYTHONPATH: scripts/mac
        run: >-
          python -m unittest
          scripts/mac/test_runtime.py
          scripts/mac/test_coordinator.py
          scripts/mac/test_local_access.py
          scripts/mac/test_validate_audio.py
          scripts/mac/test_validate_speed_ramp.py
          scripts/mac/test_soak.py
      - name: Test native media cancellation and cleanup
        env:
          PYTHONPATH: services/media-service
        run: python -m unittest services/media-service/test_media.py
